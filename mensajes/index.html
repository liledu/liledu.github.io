<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Mensajes · Pene</title><style>body{margin:0;min-height:100vh;background:#101812;color:#f3f7f2;font:16px Arial;display:grid;place-items:center;padding:24px}main{width:min(620px,100%);padding:28px;border-radius:24px;background:#17321ccc;backdrop-filter:blur(16px)}h1{margin-top:0}textarea{width:100%;min-height:130px;resize:vertical;box-sizing:border-box;padding:14px;border-radius:14px;border:1px solid #ffffff25;background:#0b120d;color:white;font:inherit}button{margin-top:12px;padding:11px 17px;border:0;border-radius:20px;background:#a8d77b;color:#142012;font-weight:bold;cursor:pointer}.back{display:inline-block;margin-bottom:22px;color:#cfe9bc}.note{color:#aeb9af;font-size:13px}.error{color:#ffb2b2}.success{color:#d7f5bf} </style><main><a class="back" href="../">← Volver al pasto</a><h1>Dejá un mensaje</h1><p class="note">Tu mensaje aparecerá en la página principal.</p><form id="form"><textarea id="text" maxlength="280" placeholder="Escribí algo..." required></textarea><br><button>Publicar mensaje</button><p id="status" role="status"></p></form></main><script>const API='https://pene.up.railway.app',form=document.querySelector('form'),text=document.querySelector('#text'),status=document.querySelector('#status');form.addEventListener('submit',async e=>{e.preventDefault();const value=text.value.trim();if(!value)return;status.className='';status.textContent='Publicando…';try{const r=await fetch(API+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:value})});if(!r.ok)throw Error();text.value='';status.className='success';status.textContent='Mensaje publicado.'}catch{status.className='error';status.textContent='No se pudo publicar. Intentá de nuevo.'}});</script>
