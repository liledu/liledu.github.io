<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <title>Store · Pene</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #09090b; color: #f5f5f7; }
    body { font-family: "Manrope", Arial, sans-serif; overflow-x: hidden; }

    main {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 18px 34px;
      isolation: isolate;
      background: #09090b;
    }

    .landscape {
      position: absolute;
      inset: 0;
      z-index: -3;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 1.5s ease;
    }

    .landscape.active { opacity: 1; }
    .landscape.day { background-image: url("../assets/day.webp"); }
    .landscape.evening { background-image: url("../assets/evening.webp"); }
    .landscape.night { background-image: url("../assets/night.webp"); }

    main::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background: linear-gradient(rgba(0,0,0,.2), rgba(0,0,0,.05) 42%, rgba(0,0,0,.62));
    }

    main::after {
      content: "";
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: -110px;
      height: 330px;
      z-index: -1;
      background:
        radial-gradient(ellipse at 25% 100%, #19391a 0 28%, transparent 29%),
        radial-gradient(ellipse at 55% 100%, #112b16 0 31%, transparent 32%),
        radial-gradient(ellipse at 80% 100%, #183619 0 28%, transparent 29%);
      filter: blur(1px);
    }

    .topbar {
      width: min(1080px, 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 5;
    }

    .back, .balance {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #f4f8f1;
      font: 700 12px/1 Arial, sans-serif;
      letter-spacing: .02em;
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 999px;
      background: rgba(7,16,11,.49);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 8px 28px rgba(0,0,0,.2);
    }

    .balance strong { font-family: "Manrope", Arial, sans-serif; font-size: 13px; }

    .hero {
      width: min(1080px, 100%);
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 38px 0 18px;
      z-index: 2;
    }

    h1 {
      margin: 0;
      font-size: clamp(4.3rem, 13vw, 9rem);
      line-height: .82;
      font-weight: 800;
      letter-spacing: -.075em;
      text-shadow: 0 2px 28px rgba(0,0,0,.68);
    }

    .subtitle {
      margin: 20px 0 0;
      color: #eef4ea;
      font: 600 13px/1.5 Arial, sans-serif;
      text-shadow: 0 2px 18px rgba(0,0,0,.78);
      max-width: 520px;
    }

    .shelf-wrap { width: min(1080px, 100%); z-index: 3; }

    .shelf-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin: 0 2px 10px;
      text-shadow: 0 2px 12px rgba(0,0,0,.68);
    }

    .shelf-head h2 { margin: 0; font-size: 16px; letter-spacing: -.03em; }
    .shelf-head span { font: 12px Arial, sans-serif; color: #dbe4d6; }

    .shelf {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .item {
      position: relative;
      min-height: 138px;
      padding: 16px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,.14);
      background: linear-gradient(145deg, rgba(13,27,18,.78), rgba(8,16,11,.71));
      backdrop-filter: blur(18px) saturate(120%);
      -webkit-backdrop-filter: blur(18px) saturate(120%);
      box-shadow: 0 18px 50px rgba(0,0,0,.33), inset 0 1px 0 rgba(255,255,255,.09);
      overflow: hidden;
    }

    .item::after {
      content: "";
      position: absolute;
      width: 100px;
      height: 100px;
      right: -28px;
      top: -28px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(204,238,179,.13), transparent 65%);
      pointer-events: none;
    }

    .tag {
      display: inline-block;
      margin-bottom: 12px;
      padding: 6px 9px;
      border-radius: 999px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.09);
      color: #d9efcb;
      font: 700 10px Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .item h3 { margin: 0 0 5px; font-size: 18px; letter-spacing: -.04em; }
    .item p { margin: 0; color: #c9d2c4; font: 12px/1.45 Arial, sans-serif; max-width: 31ch; }

    .bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 15px;
    }

    .price { font-size: 15px; font-weight: 800; }

    button {
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 999px;
      padding: 9px 12px;
      background: #a8d77b;
      color: #132012;
      font: 800 11px Arial, sans-serif;
      cursor: pointer;
    }

    button.locked {
      background: rgba(255,255,255,.05);
      color: rgba(255,255,255,.44);
      cursor: not-allowed;
    }

    #status {
      min-height: 20px;
      margin: 10px 0 0;
      text-align: center;
      color: #e8f5df;
      font: 12px Arial, sans-serif;
      text-shadow: 0 1px 8px rgba(0,0,0,.7);
    }

    @media (max-width: 760px) {
      main { padding: 18px 12px 24px; }
      .hero { justify-content: flex-start; padding-top: 70px; padding-bottom: 34px; }
      h1 { font-size: clamp(4rem, 22vw, 7rem); }
      .subtitle { font-size: 12px; max-width: 330px; }
      .shelf { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; }
      .shelf::-webkit-scrollbar { display: none; }
      .item { min-width: min(82vw, 320px); scroll-snap-align: center; }
      .shelf-head span { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .landscape { transition: none; }
    }
  </style>
</head>

<body>
  <main>
    <div class="landscape day" aria-hidden="true"></div>
    <div class="landscape evening" aria-hidden="true"></div>
    <div class="landscape night active" aria-hidden="true"></div>

    <nav class="topbar">
      <a class="back" href="../">← Volver al pasto</a>
      <div class="balance">Global <strong id="globalClicks">…</strong></div>
    </nav>

    <section class="hero">
      <h1>Store</h1>
      <p class="subtitle">
        Los clicks que todos dan al pasto forman una sola bolsa global.
        Entre todos pueden desbloquear cosas para la página.
      </p>
    </section>

    <section class="shelf-wrap">
      <div class="shelf-head">
        <h2>Disponible para la comunidad</h2>
        <span>Mockup visual · todavía no descuenta clicks</span>
      </div>

      <div class="shelf" id="shelf"></div>

      <p id="status">
        Elegí algo para ver cómo se sentiría la compra.
      </p>
    </section>
  </main>

  <script>
    const API = "https://pene.up.railway.app";

    const items = [
      {
        name: "Lluvia suave",
        tag: "Clima",
        price: 250,
        desc: "Lluvia ligera sobre el paisaje durante unos minutos."
      },
      {
        name: "Luciérnagas",
        tag: "Noche",
        price: 600,
        desc: "Pequeñas luces flotando cuando la página entra en modo noche."
      },
      {
        name: "Mariposas",
        tag: "Evento",
        price: 950,
        desc: "Un grupo de mariposas cruza el campo para todos."
      },
      {
        name: "Atardecer eterno",
        tag: "Ambiente",
        price: 1800,
        desc: "Mantiene el paisaje de tarde activo por un rato."
      },
      {
        name: "Estrellas fugaces",
        tag: "Rareza",
        price: 3200,
        desc: "Activa estrellas fugaces aleatorias en el cielo nocturno."
      },
      {
        name: "Campo dorado",
        tag: "Legendario",
        price: 8000,
        desc: "Convierte temporalmente el pasto en una versión dorada."
      }
    ];

    const clicksEl = document.getElementById("globalClicks");
    const shelf = document.getElementById("shelf");
    const status = document.getElementById("status");

    const format = number => new Intl.NumberFormat("es-HN").format(number);

    function updateScene() {
      const hour = new Date().getHours();

      const scene =
        hour >= 6 && hour < 16
          ? "day"
          : hour >= 16 && hour < 19
          ? "evening"
          : "night";

      document
        .querySelectorAll(".landscape")
        .forEach(element => {
          element.classList.toggle(
            "active",
            element.classList.contains(scene)
          );
        });
    }

    function render(total = 0) {
      shelf.innerHTML = items
        .map((item, index) => {
          const affordable = total >= item.price;

          return `
            <article class="item">
              <span class="tag">${item.tag}</span>
              <h3>${item.name}</h3>
              <p>${item.desc}</p>

              <div class="bottom">
                <span class="price">${format(item.price)} clicks</span>

                <button
                  class="${affordable ? "" : "locked"}"
                  data-i="${index}"
                >
                  ${affordable ? "Comprar" : "Faltan clicks"}
                </button>
              </div>
            </article>
          `;
        })
        .join("");
    }

    async function load() {
      try {
        const response = await fetch(
          API + "/clicks",
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error();
        }

        const data = await response.json();

        const total =
          Number.isSafeInteger(data.clicks)
            ? data.clicks
            : 0;

        clicksEl.textContent =
          format(total) +
          " clicks";

        render(total);
      } catch {
        clicksEl.textContent =
          "sin conexión";

        render(0);
      }
    }

    shelf.addEventListener(
      "click",
      event => {
        const button =
          event.target.closest("button");

        if (!button) {
          return;
        }

        if (
          button.classList.contains("locked")
        ) {
          status.textContent =
            "La comunidad todavía no tiene suficientes clicks para eso.";

          return;
        }

        const item =
          items[
            Number(button.dataset.i)
          ];

        status.textContent =
          "Mockup: aquí se confirmaría la compra global de “" +
          item.name +
          "”.";
      }
    );

    updateScene();
    setInterval(updateScene, 60000);
    load();
  </script>
</body>
</html>
