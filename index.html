<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <title>Pene</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #09090b;
      color: #f5f5f7;
      font-family: "Manrope", Arial, sans-serif;
    }
    main {
      position: relative;
      overflow: hidden;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 48px 24px calc(clamp(180px, 32svh, 340px) + 24px);
      background: #09090b;
      isolation: isolate;
    }
    .landscape { position: absolute; inset: 0; z-index: -2; background: center / cover no-repeat; opacity: 0; transition: opacity 1.5s ease; pointer-events: none; }
    .landscape.active { opacity: 1; }
    .landscape.day { background-image: url('assets/day.webp'); }
    .landscape.evening { background-image: url('assets/evening.webp'); }
    .landscape.night { background-image: url('assets/night.webp'); }
    main::before { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(#0003, #0002 45%, #0006); pointer-events: none; }
    h1, .hint { text-shadow: 0 2px 24px #0009; }
    .stats { padding: 10px 14px; border-radius: 24px; background: #08110c80; backdrop-filter: blur(12px); }
    #sync-status { display: block; min-height: 16px; margin: 10px 0; color: #fff; font: 12px Arial, sans-serif; text-shadow: 0 1px 6px #000; }
    h1 {
      margin: 0;
      font-size: clamp(4rem, 20vw, 18rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.075em;
      animation: appear 700ms ease-out both;
    }
    .field { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: clamp(180px, 32svh, 340px); margin: 0; border: 0; padding: 0; background: transparent; cursor: pointer; color: inherit; touch-action: manipulation; }
    canvas { display: block; width: 100%; height: 100%; }
    .field:focus-visible { outline: 2px solid #8aca8e; outline-offset: -3px; border-radius: 0; }
    .hint { color: #f0f4ed; font: 12px Arial, sans-serif; letter-spacing: .08em; margin: 18px 0 10px; text-align: center; }
    .stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; align-items: center; font: 12px Arial, sans-serif; color: #f0f4ed; }
    .download { font: inherit; color: inherit; border: 1px solid #ffffff20; border-radius: 20px; background: #ffffff05; padding: 8px 14px; cursor: pointer; }
    ::selection { background: #c4b5fd; color: #09090b; }
    @keyframes appear {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      h1 { animation: none; }
      .landscape { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="landscape day" aria-hidden="true"></div>
    <div class="landscape evening" aria-hidden="true"></div>
    <div class="landscape night active" aria-hidden="true"></div>
    <h1>Pene</h1>
    <button class="field" id="field" aria-label="Tocar el pasto y sumar un clic">
      <canvas id="grass" aria-hidden="true"></canvas>
    </button>
    <p class="hint">Tocá el pasto. Un poquito de aire libre.</p>
    <div class="stats">
      <span id="count" role="status" aria-live="polite"></span>
      <button class="download" id="download">Descargar JSON</button>
    </div>
    <p id="sync-status" role="status" aria-live="polite"></p>
  </main>
  <script>
    (() => {
      const canvas = document.getElementById('grass');
      const ctx = canvas.getContext('2d');
      const field = document.getElementById('field');
      const label = document.getElementById('count');
      const API = 'https://pene.up.railway.app';
      const reduced = matchMedia('(prefers-reduced-motion: reduce)');
      const status = document.getElementById('sync-status');
      const queueKey = 'grass-pending-batches-v2';
      let confirmed = 0, queue = [], sending = false, refreshing = false, timer = 0;
      try {
        const saved = JSON.parse(sessionStorage.getItem(queueKey) || '[]');
        if (Array.isArray(saved)) queue = saved.filter(b => b && Number.isInteger(b.amount) && b.amount > 0 && b.amount <= 100 && typeof b.id === 'string' && /^[0-9a-f-]{36}$/.test(b.id) && Date.now() - b.createdAt < 23 * 3600000);
      } catch {}
      const persist = () => { try { sessionStorage.setItem(queueKey, JSON.stringify(queue)); } catch {} };
      const updateCount = () => {
        const total = confirmed + queue.reduce((n, b) => n + b.amount, 0);
        label.textContent = total.toLocaleString('es-HN') + (total === 1 ? ' toque al pasto' : ' toques al pasto');
      };
      async function requestCount(batch) {
        const response = await fetch(API + '/clicks', {
          method: batch ? 'POST' : 'GET',
          ...(batch ? { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(batch), keepalive: true } : {}),
          signal: AbortSignal.timeout(60000)
        });
        if (!response.ok) throw new Error('sync');
        const data = await response.json();
        if (!Number.isSafeInteger(data.clicks) || data.clicks < 0) throw new Error('data');
        return data;
      }
      function scheduleSync(delay = 1500) {
        if (!timer && !sending) timer = setTimeout(() => { timer = 0; flush(); }, delay);
      }
      async function flush() {
        if (sending || !queue.length) return;
        if (refreshing) { scheduleSync(); return; }
        sending = true;
        const batch = queue[0];
        // Freeze a batch once submitted; retry with its same ID after a lost response.
        batch.sealed = true; persist();
        try {
          const data = await requestCount(batch);
          queue.shift(); confirmed = data.clicks; persist(); status.textContent = '';
        } catch {
          status.textContent = 'Sin sincronizar. Tus toques siguen pendientes.';
        } finally {
          sending = false; updateCount();
          if (queue.length) scheduleSync(status.textContent ? 15000 : 1500);
        }
      }
      function addClick() {
        let batch = queue[queue.length - 1];
        if (!batch || batch.sealed || batch.amount >= 100) {
          batch = { id: crypto.randomUUID(), amount: 0, createdAt: Date.now() };
          queue.push(batch);
        }
        batch.amount++; persist(); updateCount(); scheduleSync();
      }
      async function refreshCount() {
        if (sending || refreshing || queue.length) return;
        refreshing = true;
        try { const data = await requestCount(); confirmed = data.clicks; status.textContent = ''; }
        catch { status.textContent = 'No se pudo actualizar el total.'; }
        finally { refreshing = false; updateCount(); if (queue.length) scheduleSync(); }
      }
      function updateScene() {
        const hour = new Date().getHours();
        const scene = hour >= 6 && hour < 16 ? 'day' : hour >= 16 && hour < 19 ? 'evening' : 'night';
        document.querySelectorAll('.landscape').forEach(el => el.classList.toggle('active', el.classList.contains(scene)));
      }
      updateScene();
      setInterval(updateScene, 60000);
      updateCount();
      if (queue.length) scheduleSync(); else refreshCount();
      setInterval(() => { if (!document.hidden) refreshCount(); }, 30000);
      addEventListener('online', () => { if (queue.length) scheduleSync(0); else refreshCount(); });
      document.addEventListener('visibilitychange', () => {
        updateScene();
        if (document.hidden) { clearTimeout(timer); timer = 0; flush(); }
        else if (queue.length) scheduleSync(); else refreshCount();
      });
      let width = 0, height = 0, blades = [], ripples = [];
      let pointer = { x: -1000, y: -1000 };
      function resize() {
        const box = field.getBoundingClientRect();
        width = box.width; height = box.height;
        const dpr = Math.min(devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
        if (!ctx) return;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        blades = Array.from({ length: Math.min(1800, Math.floor(width * 1.3)) }, () => ({
          x: Math.random() * width,
          y: height * (.82 + Math.random() * .22),
          h: height * (.22 + Math.random() * .42),
          lean: (Math.random() - .5) * 28,
          phase: Math.random() * Math.PI * 2,
          size: 1.5 + Math.random() * 3,
          light: 20 + Math.random() * 28
        })).sort((a,b) => a.y - b.y);
        draw(performance.now());
      }
      function draw(now) {
        if (!ctx) return;
        ctx.clearRect(0, 0, width, height);
        const glow = ctx.createRadialGradient(width/2, height*.85, 0, width/2, height*.85, width*.5);
        glow.addColorStop(0, '#284c252f'); glow.addColorStop(1, '#09090b00');
        ctx.fillStyle = glow; ctx.fillRect(0,0,width,height);
        const ground = ctx.createLinearGradient(0, height * .82, 0, height);
        ground.addColorStop(0, '#15271800'); ground.addColorStop(1, '#152718');
        ctx.fillStyle = ground; ctx.fillRect(0, height * .82, width, height * .18);
        for (const b of blades) {
          const distance = Math.hypot(pointer.x-b.x, pointer.y-(b.y-b.h*.6));
          const force = Math.max(0, 1-distance/110);
          let bend = b.lean + (reduced.matches ? 0 : Math.sin(now*.0015+b.phase)*9);
          bend += (b.x < pointer.x ? -1 : 1)*force*45;
          for (const r of ripples) {
            const age = (now-r.start)/1000;
            const wave = Math.max(0,1-Math.abs(Math.abs(b.x-r.x)-age*220)/65);
            bend += (b.x < r.x ? -1 : 1)*wave*(1-age)*35;
          }
          ctx.fillStyle = 'hsl('+(110+b.light*.5)+' 38% '+b.light+'%)';
          ctx.beginPath(); ctx.moveTo(b.x-b.size/2,b.y);
          ctx.quadraticCurveTo(b.x+bend*.15,b.y-b.h*.55,b.x+bend,b.y-b.h);
          ctx.quadraticCurveTo(b.x+bend*.4+b.size,b.y-b.h*.45,b.x+b.size/2,b.y);
          ctx.fill();
        }
        for (const r of ripples) {
          const age=(now-r.start)/1000;
          ctx.strokeStyle='rgba(184,231,166,'+Math.max(0,(1-age)*.4)+')';
          ctx.lineWidth=1;
          ctx.beginPath();ctx.ellipse(r.x,r.y,12+age*90,4+age*22,0,0,Math.PI*2);ctx.stroke();
        }
        ripples = ripples.filter(r => now-r.start<1000);
      }
      field.addEventListener('pointermove', e => {
        const b=field.getBoundingClientRect(); pointer={x:e.clientX-b.left,y:e.clientY-b.top};
        if(reduced.matches) draw(performance.now());
      });
      field.addEventListener('pointerleave', () => {pointer={x:-1000,y:-1000};if(reduced.matches)draw(performance.now());});
      field.addEventListener('click', async e => {
        const b=field.getBoundingClientRect();
        if (!reduced.matches) ripples.push({x:e.detail ? e.clientX-b.left : width/2,y:e.detail ? e.clientY-b.top : height*.8,start:performance.now()});
        addClick();
      });
      document.getElementById('download').addEventListener('click', async () => {
        try {
          const data = await requestCount();
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob), link = document.createElement('a');
          link.href = url; link.download = 'grass-clicks.json'; link.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        } catch { status.textContent = 'No se pudo descargar el contador.'; }
      });
      new ResizeObserver(resize).observe(field);
      let frame=0;
      function animate(t){draw(t);frame=requestAnimationFrame(animate);}
      function schedule(){cancelAnimationFrame(frame);if(!document.hidden&&!reduced.matches&&ctx)frame=requestAnimationFrame(animate);else draw(performance.now());}
      document.addEventListener('visibilitychange',schedule);
      reduced.addEventListener('change',schedule);
      schedule();
    })();
  </script>
</body>
</html>
